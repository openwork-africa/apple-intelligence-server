name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in the code
        run: |
          version="$(sed -n 's/.*static let version = "\(.*\)"/\1/p' Sources/AppleIntelligenceServer/Support/ServerInfo.swift)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in ServerInfo.swift" >&2
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Bundle
        run: Scripts/bundle.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
